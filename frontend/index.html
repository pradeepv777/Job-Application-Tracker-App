<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Job Application Tracker - Track job applications, interview rounds, resumes and salary analytics in one place.">
  <title>Job Application Tracker</title>

  <!-- Modular Stylesheets (Cache-busted) -->
  <link rel="stylesheet" href="css/base.css?v=mono2">
  <link rel="stylesheet" href="css/layout.css?v=mono2">
  <link rel="stylesheet" href="css/components.css?v=mono2">
  <link rel="stylesheet" href="css/pages.css?v=mono2">
</head>
<body>

  <!-- 1. Notification / Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- 2. Shared Header & Navigation Slot -->
  <div id="header-container-slot"></div>

  <!-- 3. Main Views Container -->
  <main class="main-content">
    <!-- 3.1 Auth View Slot (Login & Registration) -->
    <div id="auth-container-slot"></div>

    <!-- 3.2 Dashboard & Applications Table Slot -->
    <div id="dashboard-container-slot"></div>

    <!-- 3.3 Placement Analytics Slot -->
    <div id="analytics-container-slot"></div>
  </main>

  <!-- 4. Modals & Dialogs Slot (Application, Interviews, Resume) -->
  <div id="modals-container-slot"></div>

  <!-- Main Application Orchestrator -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
