<!-- ================================================================== -->
<!-- DASHBOARD & APPLICATIONS VIEW                                      -->
<!-- ================================================================== -->
<section id="dashboard-section" class="view-section">

  <!-- Statistics Cards Grid -->
  <div class="stats-grid">
    <div class="stat-card total">
      <span class="stat-label">Total Applications</span>
      <span class="stat-value" id="stat-total">0</span>
    </div>
    <div class="stat-card applied">
      <span class="stat-label">Applied</span>
      <span class="stat-value" id="stat-applied">0</span>
    </div>
    <div class="stat-card interview">
      <span class="stat-label">Interviews</span>
      <span class="stat-value" id="stat-interview">0</span>
    </div>
    <div class="stat-card offer">
      <span class="stat-label">Offers</span>
      <span class="stat-value" id="stat-offer">0</span>
    </div>
    <div class="stat-card rejected">
      <span class="stat-label">Rejected</span>
      <span class="stat-value" id="stat-rejected">0</span>
    </div>
  </div>

  <!-- Dashboard Header & New Action -->
  <div class="dashboard-header">
    <div class="dashboard-title">
      <h2>Applications</h2>
      <p>Manage, filter, and track status for all applied roles</p>
    </div>
    <button class="btn btn-primary" id="btn-new-application">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Add Application
    </button>
  </div>

  <!-- Search, Filtering & Sorting Toolbar -->
  <div class="toolbar">
    <div class="toolbar-filters">
      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Search by company...">
      </div>

      <select id="filter-status" class="filter-select">
        <option value="">All Statuses</option>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
      </select>

      <select id="sort-by" class="filter-select">
        <option value="id">Sort by: ID</option>
        <option value="company">Sort by: Company</option>
        <option value="salary">Sort by: Salary</option>
        <option value="status">Sort by: Status</option>
      </select>

      <button id="btn-sort-order" class="btn btn-secondary btn-sm" title="Toggle Sort Order">ASC</button>
    </div>

    <div>
      <select id="page-limit-select" class="filter-select">
        <option value="5">5 per page</option>
        <option value="10" selected>10 per page</option>
        <option value="20">20 per page</option>
      </select>
    </div>
  </div>

  <!-- Applications Table & Pagination -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width: 70px;">ID</th>
            <th>Company</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Status</th>
            <th style="width: 220px; text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="applications-table-body">
          <!-- Dynamically populated via js/applications.js -->
        </tbody>
      </table>
    </div>

    <!-- Empty & Loading States -->
    <div id="table-loading" class="empty-state" style="display: none;">
      <p>Loading applications...</p>
    </div>

    <div id="table-empty" class="empty-state" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
      <p>No job applications found matching your criteria.</p>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination-bar">
      <span id="pagination-info">Showing 0 of 0 applications</span>
      <div class="pagination-controls">
        <button id="btn-prev-page" class="page-btn" disabled>&larr; Previous</button>
        <button id="btn-next-page" class="page-btn" disabled>Next &rarr;</button>
      </div>
    </div>
  </div>
</section>
