<!-- ==================================================================== -->
<!-- SHARED LAYOUT & NAVIGATION HEADER                                   -->
<!-- ==================================================================== -->
<header class="app-header" id="app-header" style="display: none;">
  <div class="header-container">
    <a href="#" class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
      <span>JobTracker</span>
    </a>

    <!-- Authenticated Navigation Tabs -->
    <nav class="nav-links" id="nav-links" style="display: none;">
      <button class="nav-btn active" data-view="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Dashboard
      </button>
      <button class="nav-btn" data-view="analytics">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        Analytics
      </button>
      <button class="nav-btn" id="btn-open-resume">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Resume
      </button>
    </nav>

    <!-- Authenticated User Profile & Logout -->
    <div class="user-profile" id="user-profile" style="display: none;">
      <span class="user-badge" id="current-user-email"></span>
      <button class="btn btn-secondary btn-sm" id="btn-logout">Logout</button>
    </div>
  </div>
</header>
